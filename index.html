<html lang="en">

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mulish:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root{
      --navy-950:#0d0a35; --navy-900:#14104a; --navy-800:#1b1660; --navy-700:#251d7f;
      --navy-600:#322aa0; --navy-500:#4339c4; --navy-400:#6c63d8; --navy-300:#9d97e6;
      --navy-200:#c7c3f1; --navy-100:#e6e4f9; --navy-50:#f2f1fc;
      --red-700:#c60819; --red-600:#e8091b;
      --gray-900:#14161f; --gray-800:#23262f; --gray-500:#6b6f7d; --gray-400:#939aa8;
      --gray-300:#c2c6d0; --gray-200:#dee1e8; --gray-100:#eef0f4; --gray-50:#f7f8fb;

      --primary:var(--navy-700); --accent:var(--red-600);
      --text-heading:var(--navy-800); --text-body:var(--gray-800);
      --text-muted:var(--gray-500); --text-subtle:var(--gray-400);
      --surface-page:var(--gray-50); --surface-card:#ffffff;
      --border-subtle:var(--gray-200); --divider:var(--gray-200);

      --font-display:'Cinzel','Trajan Pro','Times New Roman',serif;
      --font-serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
      --font-sans:'Mulish',system-ui,-apple-system,'Segoe UI',sans-serif;
      --tracking-wide:0.04em; --tracking-wider:0.12em; --tracking-widest:0.22em;

      --radius-md:6px; --radius-lg:10px; --radius-xl:16px; --radius-pill:999px;
      --gap:0.72rem;
      --shadow-sm:0 1px 3px rgba(20,16,74,.08),0 1px 2px rgba(20,16,74,.06);
      --shadow-md:0 4px 12px rgba(20,16,74,.10),0 2px 4px rgba(20,16,74,.06);
      --shadow-lg:0 12px 28px rgba(20,16,74,.14),0 4px 10px rgba(20,16,74,.08);
      --shadow-navy:0 12px 26px rgba(37,29,127,.30);
      --ease:cubic-bezier(.16,1,.3,1);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-body);
      line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}

    /* DPM plate */
    .plate{display:inline-flex;flex-direction:column;align-items:center;background:var(--navy-700);
      border:3px solid var(--accent);border-radius:var(--radius-lg);box-shadow:var(--shadow-navy);
      padding:.4rem .9rem .46rem;}
    .plate .dpm{font-family:var(--font-display);font-weight:700;color:#fff;letter-spacing:.13em;
      line-height:1;font-size:1.5rem;}
    .plate .plate-rule{width:28px;height:3px;background:var(--accent);border-radius:2px;margin-top:.35rem;}
    .plate.mini{flex-direction:row;padding:.28rem .5rem;border-width:2px;border-radius:7px;box-shadow:none;}
    .plate.mini .dpm{font-size:.98rem;letter-spacing:.1em;}
    .plate.mini .plate-rule{display:none;}

    /* Top bar */
    .topbar{position:sticky;top:0;z-index:50;background:rgba(20,16,74,.82);
      backdrop-filter:saturate(150%) blur(12px);-webkit-backdrop-filter:saturate(150%) blur(12px);
      border-bottom:1px solid rgba(199,195,241,.16);}
    .topbar-inner{max-width:1200px;margin:0 auto;padding:.6rem 1.5rem;display:flex;align-items:center;gap:1rem;}
    .topbar-brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;}
    .topbar-word{font-family:var(--font-display);font-weight:600;color:#fff;font-size:.95rem;
      letter-spacing:var(--tracking-wide);white-space:nowrap;}
    .topbar-search{margin-left:auto;}
    .topbar-search .field{width:250px;}

    /* Hero */
    .hero{position:relative;overflow:hidden;color:#fff;border-bottom:1px solid rgba(199,195,241,.14);
      background:
        radial-gradient(120% 120% at 88% -40%, rgba(232,9,27,.18), transparent 55%),
        radial-gradient(90% 120% at 6% 140%, rgba(67,57,196,.32), transparent 55%),
        linear-gradient(158deg, var(--navy-900) 0%, var(--navy-800) 55%, var(--navy-700) 100%);}
    .hero::after{content:"DPM";position:absolute;right:-1rem;bottom:-2.4rem;font-family:var(--font-display);
      font-weight:900;font-size:9rem;color:rgba(199,195,241,.06);letter-spacing:.05em;pointer-events:none;
      line-height:.8;user-select:none;}
    .hero-inner{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:1.15rem 1.5rem 1.25rem;
      display:flex;flex-direction:column;align-items:center;text-align:center;}
    .hero .plate{margin-bottom:.65rem;}
    .eyebrow{font-family:var(--font-display);font-weight:600;font-size:.7rem;
      letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--navy-200);
      display:inline-flex;align-items:center;gap:.55rem;margin-bottom:.55rem;}
    .eyebrow::before,.eyebrow::after{content:"";width:18px;height:2px;background:var(--accent);
      border-radius:2px;opacity:.9;}
    .hero h1{font-family:var(--font-display);font-weight:700;color:#fff;font-size:clamp(1.6rem,3.4vw,2.4rem);
      line-height:1.04;letter-spacing:var(--tracking-wide);}

    /* Search field (top bar only) */
    .field{display:flex;align-items:center;gap:.6rem;border-radius:var(--radius-lg);padding:0 .8rem;
      transition:box-shadow .18s ease,border-color .18s ease;
      background:rgba(255,255,255,.1);border:1px solid rgba(199,195,241,.24);}
    .field svg{width:17px;height:17px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
      flex-shrink:0;stroke:var(--navy-200);}
    .field input{border:none;outline:none;background:none;width:100%;font-family:var(--font-sans);
      font-size:.9rem;color:#fff;padding:.48rem 0;}
    .field input::placeholder{color:var(--navy-200);}
    .field .slash{font-family:var(--font-display);font-size:.7rem;color:var(--navy-200);
      border:1px solid rgba(199,195,241,.3);border-radius:5px;padding:.06rem .38rem;flex-shrink:0;}
    .field:focus-within{border-color:var(--navy-300);box-shadow:0 0 0 3px rgba(199,195,241,.15);}

    /* Board: featured tile on top, then a centred grid */
    main{max-width:1200px;margin:0 auto;padding:1.2rem 1.5rem 0.9rem;}
    .board{max-width:788px;margin:0 auto;}
    .board-top{display:flex;justify-content:center;margin-bottom:var(--gap);}
    .board-top .tile{width:calc((100% - 2 * var(--gap)) / 3);}
    .board-grid{display:flex;flex-wrap:wrap;gap:var(--gap);justify-content:center;}
    .board-grid .tile{width:calc((100% - 2 * var(--gap)) / 3);}

    .tile{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
      text-align:center;gap:.5rem;background:var(--surface-card);border:1px solid var(--border-subtle);
      border-radius:var(--radius-lg);padding:.82rem .85rem .78rem;text-decoration:none;color:inherit;
      box-shadow:var(--shadow-sm);transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .15s ease;}
    .tile::after{content:"";position:absolute;left:50%;right:50%;bottom:0;height:3px;background:var(--accent);
      transition:left .2s var(--ease),right .2s var(--ease);}
    .tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--navy-100);}
    .tile:hover::after{left:22%;right:22%;}
    .tile:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
    .board-top .tile{border-color:var(--navy-200);box-shadow:var(--shadow-md);
      background:linear-gradient(180deg,var(--navy-50),#fff);}

    .tile-icon{width:42px;height:42px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
      overflow:hidden;background:var(--navy-50);border:1px solid var(--navy-100);}
    .tile-icon img{max-width:27px;max-height:27px;width:auto;height:auto;display:block;object-fit:contain;}
    .tile-icon.letter{font-family:var(--font-display);font-weight:700;font-size:1.25rem;color:var(--navy-700);}

    .tile-body{min-width:0;width:100%;}
    .tile-name{font-family:var(--font-sans);font-weight:700;font-size:.92rem;color:var(--text-heading);
      line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .tile-desc{font-size:.74rem;color:var(--text-muted);margin-top:.18rem;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;}

    .no-results{display:none;text-align:center;padding:2rem 1rem;color:var(--text-muted);font-size:.95rem;}
    .no-results.show{display:block;}
    .no-results strong{color:var(--text-heading);}

    /* Footer */
    footer{border-top:1px solid var(--divider);max-width:1200px;margin:0 auto;padding:1rem 1.5rem 1.2rem;
      display:flex;flex-wrap:wrap;gap:.7rem 1.4rem;align-items:center;justify-content:space-between;
      color:var(--text-muted);font-size:.82rem;}
    footer .f-brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;}
    footer .f-brand .name{font-family:var(--font-display);font-weight:600;color:var(--text-heading);
      letter-spacing:var(--tracking-wide);font-size:.85rem;transition:color .15s ease;}
    footer .f-brand:hover .name{color:var(--accent);}
    footer .updated .tag{color:var(--navy-700);font-weight:700;background:var(--navy-50);
      padding:.12rem .5rem;border-radius:var(--radius-md);margin-left:.3rem;}
    footer .foot-right{display:flex;flex-direction:column;align-items:flex-end;gap:.15rem;}
    footer .version{font-size:.68rem;color:var(--text-subtle);letter-spacing:.05em;font-weight:600;}

    @media (max-width:720px){ .topbar-search{display:none;} .hero::after{font-size:7rem;} }
    @media (max-width:640px){
      .board-grid .tile,.board-top .tile{width:calc((100% - 1 * var(--gap)) / 2);}
    }
    @media (max-width:400px){
      .board-grid .tile,.board-top .tile{width:100%;}
    }
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto;}}
  
    /* ---- Fit-to-window: every app on one screen, scaled to fill the window ---- */
    html,body{height:100%;overflow:hidden;}
    #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      overflow:hidden;background:var(--surface-page);}
    #stage{transform-origin:center center;width:fit-content;--tilew:240px;--cols:3;}
    #stage .topbar{display:none;}
    #stage main{max-width:none;padding:14px 20px 8px;}
    #stage .board{max-width:none;}
    #stage .hero h1{font-size:2rem;}
    #stage .hero-inner{padding:16px 20px 18px;}
    #stage .board-top{margin-bottom:14px;}
    #stage .board-top .tile{width:var(--tilew);}
    #stage .board-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:0 auto;width:calc(var(--cols) * var(--tilew) + (var(--cols) - 1) * 14px + 2px);}
    #stage .board-grid .tile{width:var(--tilew);}
    #stage footer{max-width:none;padding:10px 20px 14px;}
  </style>
</head>

  /* ---- Rendering (you shouldn't need to change anything below) ---- */
  const root = document.getElementById("app-root");
  const noResults = document.getElementById("no-results");
  function domainOf(url){ try{ return new URL(url).hostname.replace(/^www\./,""); }catch{ return ""; } }
  function iconFor(app){ if(app.icon) return app.icon; if(ICONS[app.name]) return ICONS[app.name]; return null; }

  function buildIcon(app){
    const wrap=document.createElement("div"); wrap.className="tile-icon";
    const sources=[]; const primary=iconFor(app); if(primary) sources.push(primary);
    const d=domainOf(app.url);
    if(d) sources.push("https://www.google.com/s2/favicons?domain="+encodeURIComponent(d)+"&sz=64");
    if(!sources.length) return letter(wrap,app.name);
    const img=document.createElement("img"); img.alt=""; img.loading="lazy"; let i=0; img.src=sources[0];
    img.addEventListener("error",()=>{ i++; if(i<sources.length) img.src=sources[i]; else letter(wrap,app.name); });
    wrap.appendChild(img); return wrap;
  }
  function letter(wrap,name){ wrap.innerHTML=""; wrap.classList.add("letter");
    wrap.textContent=(name||"?").trim().charAt(0).toUpperCase(); return wrap; }

  function tile(app){
    const a=document.createElement("a"); a.className="tile"; a.href=app.url;
    a.target="_blank"; a.rel="noopener noreferrer";
    a.dataset.search=(app.name+" "+(app.desc||"")+" "+domainOf(app.url)).toLowerCase();
    a.appendChild(buildIcon(app));
    const body=document.createElement("div"); body.className="tile-body";
    const nm=document.createElement("div"); nm.className="tile-name"; nm.textContent=app.name;
    const ds=document.createElement("div"); ds.className="tile-desc"; ds.textContent=app.desc||domainOf(app.url);
    body.append(nm,ds); a.appendChild(body);
    return a;
  }

  function render(){
    const board=document.createElement("div"); board.className="board";
    const top=document.createElement("div"); top.className="board-top";
    const grid=document.createElement("div"); grid.className="board-grid";
    if(APPS.length) top.appendChild(tile(APPS[0]));
    APPS.slice(1).forEach(a=>grid.appendChild(tile(a)));
    board.append(top,grid);
    root.insertBefore(board,noResults);
  }

  const sTop=document.getElementById("search-top");
  function filter(q){
    q=q.trim().toLowerCase(); let any=false;
    document.querySelectorAll(".tile").forEach(t=>{
      const m=!q||t.dataset.search.includes(q);
      t.style.display=m?"":"none"; if(m) any=true;
    });
    const top=document.querySelector(".board-top");
    if(top){ const t=top.querySelector(".tile"); top.style.display=(t&&t.style.display!=="none")?"":"none"; }
    noResults.classList.toggle("show",!any);
    document.getElementById("nr-q").textContent='"'+q+'"';
  }
  sTop.addEventListener("input",e=>filter(e.target.value));
  document.addEventListener("keydown",e=>{
    if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();sTop.focus();}
    else if(e.key==="Escape"&&document.activeElement===sTop){ sTop.value=""; filter(""); sTop.blur(); }
  });

  render();

  /* ---- Scale the stage to fill the window; pick the best column count ---- */
  (function(){
    var stage=document.getElementById('stage');
    var MAXS=3, MARGIN=4;
    function fit(){
      if(!stage) return;
      var availW=window.innerWidth-MARGIN, availH=window.innerHeight-MARGIN;
      var n=0; stage.querySelectorAll('.board-grid .tile').forEach(function(t){if(t.style.display!=='none')n++;});
      var maxC=Math.min(8, Math.max(2, n||2));
      var best=null;
      for(var c=2;c<=maxC;c++){
        stage.style.setProperty('--cols',c);
        var w=stage.offsetWidth, h=stage.offsetHeight;
        var s=Math.min(availW/w, availH/h);
        if(!best||s>best.s){best={c:c,s:s};}
      }
      stage.style.setProperty('--cols',best.c);
      stage.style.transform='scale('+Math.min(best.s,MAXS)+')';
    }
    var raf; function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(fit);}
    window.addEventListener('resize',schedule);
    window.addEventListener('orientationchange',schedule);
    if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
    window.addEventListener('load',fit);
    window.__fit=fit; fit(); setTimeout(fit,150);
  })();

  </script>
  <script>window.addEventListener("pageshow",function(e){if(e.persisted)location.reload();});</script>
